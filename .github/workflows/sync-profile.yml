name: Sync Mercado Livre profile

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mercado-livre-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MELI_AFFILIATE_TOOL: "51963698"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:profile
